<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>VITRALUX ERP | Registrar abono</title>
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>
<body class="bg-light">
    <header class="bg-primary">
        <div class="container py-3">
            <a th:href="@{/}" class="text-white text-decoration-none fw-bold">VITRALUX ERP</a>
        </div>
    </header>

    <main class="container py-4">
        <h1 th:text="|Registrar abono · Venta V-${venta.id}|"></h1>
        <p class="text-secondary" th:text="|Saldo pendiente: ₡ ${saldo}|"></p>

        <div th:if="${error}" th:text="${error}" class="alert alert-danger" role="alert"></div>

        <form th:action="@{/ventas/{id}/pagos/nuevo(id=${venta.id})}" method="post"
              class="card shadow-sm">
            <div class="card-body">
                <div class="row g-3">
                    <div class="col-md-6">
                        <label for="monto" class="form-label">Monto (₡)</label>
                        <input id="monto" name="monto" type="number" class="form-control"
                               min="0.01" th:max="${saldo}" step="0.01" required>
                    </div>
                    <div class="col-md-6">
                        <label for="metodo" class="form-label">Método de pago</label>
                        <select id="metodo" name="metodo" class="form-select" required>
                            <option value="">Seleccioná un método</option>
                            <option value="EFECTIVO">Efectivo</option>
                            <option value="TRANSFERENCIA">Transferencia</option>
                            <option value="TARJETA">Tarjeta</option>
                        </select>
                    </div>
                </div>

                <div class="d-flex gap-2 mt-4">
                    <button type="submit" class="btn btn-primary">Guardar abono</button>
                    <a th:href="@{/ventas/{id}(id=${venta.id})}"
                       class="btn btn-outline-secondary">Cancelar</a>
                </div>
            </div>
        </form>
    </main>
</body>
</html>
