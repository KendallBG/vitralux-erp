<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>VITRALUX ERP | Detalle de venta</title>
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>
<body class="bg-light">
    <header class="bg-primary">
        <div class="container py-3">
            <a th:href="@{/}" class="text-white text-decoration-none fw-bold">VITRALUX ERP</a>
        </div>
    </header>

    <main class="container py-4">
        <a th:href="@{/ventas}">Volver a ventas</a>
        <h1 class="mt-3" th:text="|Venta V-${venta.id}|"></h1>
        <p>
            <strong>Cliente</strong> <span th:text="${venta.cliente.nombre}"></span>
            <span class="mx-2">·</span>
            <a th:href="@{/cotizaciones/{id}(id=${venta.cotizacion.id})}"
               th:text="|Cotización COT-${venta.cotizacion.id}|"></a>
        </p>

        <div th:if="${mensaje}" th:text="${mensaje}" class="alert alert-success" role="status"></div>

        <div class="card shadow-sm mb-4">
            <div class="card-body row g-3">
                <div class="col-md-4">
                    <div class="text-secondary">Total de la venta</div>
                    <strong th:text="|₡ ${venta.total}|"></strong>
                </div>
                <div class="col-md-4">
                    <div class="text-secondary">Saldo pendiente</div>
                    <strong th:text="|₡ ${saldo}|"></strong>
                </div>
                <div class="col-md-4">
                    <div class="text-secondary">Estado de pago</div>
                    <strong th:text="${venta.estado}"></strong>
                </div>
            </div>
        </div>

        <div class="d-flex flex-wrap gap-2 justify-content-between align-items-center mb-3">
            <h2 class="h4 mb-0">Pagos registrados</h2>
            <a th:if="${saldo.signum() > 0}"
               th:href="@{/ventas/{id}/pagos/nuevo(id=${venta.id})}"
               class="btn btn-primary">Registrar abono</a>
        </div>

        <div class="table-responsive card shadow-sm">
            <table class="table table-striped mb-0">
                <thead class="table-light">
                    <tr>
                        <th scope="col">Fecha</th>
                        <th scope="col">Método</th>
                        <th scope="col">Monto</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="pago : ${pagos}">
                        <td th:text="${pago.fecha}"></td>
                        <td th:text="${pago.metodo}"></td>
                        <td th:text="|₡ ${pago.monto}|"></td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(pagos)}">
                        <td colspan="3" class="text-center text-secondary py-4">
                            Esta venta todavía no tiene abonos.
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </main>
</body>
</html>
