<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>VITRALUX ERP | Ventas</title>
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>
<body class="bg-light">
    <header class="bg-primary">
        <div class="container py-3">
            <a th:href="@{/}" class="text-white text-decoration-none fw-bold">VITRALUX ERP</a>
        </div>
    </header>

    <main class="container py-4">
        <h1>Ventas</h1>
        <p class="text-secondary">Ventas generadas a partir de cotizaciones aprobadas.</p>

        <div class="table-responsive card shadow-sm">
            <table class="table table-striped align-middle mb-0">
                <thead class="table-light">
                    <tr>
                        <th scope="col">Número</th>
                        <th scope="col">Cliente</th>
                        <th scope="col">Fecha</th>
                        <th scope="col">Total</th>
                        <th scope="col">Estado de pago</th>
                        <th scope="col">Acción</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="venta : ${ventas}">
                        <td th:text="|V-${venta.id}|"></td>
                        <td th:text="${venta.cliente.nombre}"></td>
                        <td th:text="${venta.fecha}"></td>
                        <td th:text="|₡ ${venta.total}|"></td>
                        <td th:text="${venta.estado}"></td>
                        <td>
                            <a th:href="@{/ventas/{id}(id=${venta.id})}"
                               class="btn btn-sm btn-outline-primary">Ver detalle</a>
                        </td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(ventas)}">
                        <td colspan="6" class="text-center text-secondary py-4">
                            Todavía no hay ventas.
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </main>
</body>
</html>
