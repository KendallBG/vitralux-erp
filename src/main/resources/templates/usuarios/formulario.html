<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>VITRALUX ERP | Nuevo usuario</title>
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>
<body class="bg-light">
    <main class="container py-4">
        <h1>Nuevo usuario</h1>
        <p class="text-secondary">Asigná el rol con el que va a ingresar al sistema.</p>

        <div th:if="${error}" th:text="${error}" class="alert alert-danger" role="alert"></div>

        <form th:action="@{/usuarios/nuevo}" method="post" class="card shadow-sm">
            <div class="card-body">
                <div class="row g-3">
                    <div class="col-md-6">
                        <label for="nombre" class="form-label">Nombre</label>
                        <input id="nombre" name="nombre" class="form-control"
                               th:value="${nombre}" maxlength="120" required>
                    </div>
                    <div class="col-md-6">
                        <label for="correo" class="form-label">Correo electrónico</label>
                        <input id="correo" name="correo" type="email" class="form-control"
                               th:value="${correo}" maxlength="150" required>
                    </div>
                    <div class="col-md-6">
                        <label for="clave" class="form-label">Contraseña</label>
                        <input id="clave" name="clave" type="password" class="form-control"
                               minlength="8" maxlength="72" autocomplete="new-password" required>
                    </div>
                    <div class="col-md-6">
                        <label for="rol" class="form-label">Rol</label>
                        <select id="rol" name="rol" class="form-select" required>
                            <option value="">Seleccioná un rol</option>
                            <option th:each="rol : ${roles}"
                                    th:value="${rol.name()}"
                                    th:selected="${rol == rolSeleccionado}"
                                    th:text="${rol.etiqueta}"></option>
                        </select>
                    </div>
                </div>

                <div class="d-flex gap-2 mt-4">
                    <button type="submit" class="btn btn-primary">Guardar usuario</button>
                    <a th:href="@{/usuarios}" class="btn btn-outline-secondary">Cancelar</a>
                </div>
            </div>
        </form>
    </main>
</body>
</html>
