<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>VITRALUX ERP | Usuarios</title>
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>
<body class="bg-light">
    <main class="container py-4">
        <a th:href="@{/}">Volver al panel</a>

        <div class="d-flex flex-wrap gap-2 justify-content-between align-items-center my-3">
            <h1 class="mb-0">Usuarios</h1>
            <a th:href="@{/usuarios/nuevo}" class="btn btn-primary">Nuevo usuario</a>
        </div>

        <div th:if="${mensaje}" th:text="${mensaje}" class="alert alert-success" role="status"></div>
        <div th:if="${error}" th:text="${error}" class="alert alert-danger" role="alert"></div>

        <div class="card shadow-sm table-responsive">
            <table class="table table-striped align-middle mb-0">
                <thead class="table-light">
                    <tr>
                        <th scope="col">Nombre</th>
                        <th scope="col">Correo</th>
                        <th scope="col">Rol</th>
                        <th scope="col">Acción</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="usuario : ${usuarios}">
                        <td th:text="${usuario.nombre}"></td>
                        <td th:text="${usuario.correo}"></td>
                        <td th:text="${usuario.rol.etiqueta}"></td>
                        <td>
                            <form th:if="${usuario.rol.name() != 'ADMINISTRADOR'}"
                                  th:action="@{/usuarios/{id}/rol(id=${usuario.id})}"
                                  method="post" class="d-flex flex-wrap gap-2">
                                <select name="rol" class="form-select form-select-sm w-auto"
                                        aria-label="Nuevo rol" required>
                                    <option th:each="rol : ${roles}"
                                            th:value="${rol.name()}"
                                            th:selected="${rol == usuario.rol}"
                                            th:text="${rol.etiqueta}"></option>
                                </select>
                                <button type="submit" class="btn btn-sm btn-outline-primary">
                                    Guardar rol
                                </button>
                            </form>
                            <span th:if="${usuario.rol.name() == 'ADMINISTRADOR'}"
                                  class="text-secondary">Cuenta administrativa</span>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </main>
</body>
</html>
