<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>VITRALUX ERP | Nueva orden</title>
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>
<body class="bg-light">
    <main class="container py-4">
        <h1>Nueva orden de trabajo</h1>
        <p class="text-secondary">La orden quedará vinculada a la venta con estado Pendiente.</p>

        <div th:if="${error}" th:text="${error}" class="alert alert-danger" role="alert"></div>
        <div th:if="${#lists.isEmpty(ventas)}" class="alert alert-warning">
            Primero tiene que existir una venta registrada.
        </div>

        <form th:action="@{/ordenes/nueva}" method="post" class="card shadow-sm">
            <div class="card-body">
                <label for="ventaId" class="form-label">Venta</label>
                <select id="ventaId" name="ventaId" class="form-select" required>
                    <option value="">Seleccioná una venta</option>
                    <option th:each="venta : ${ventas}" th:value="${venta.id}"
                            th:text="|V-${venta.id} · ${venta.cliente.nombre}|"></option>
                </select>
                <div class="d-flex gap-2 mt-4">
                    <button type="submit" class="btn btn-primary"
                            th:disabled="${#lists.isEmpty(ventas)}">Crear orden</button>
                    <a th:href="@{/ordenes}" class="btn btn-outline-secondary">Cancelar</a>
                </div>
            </div>
        </form>
    </main>
</body>
</html>
