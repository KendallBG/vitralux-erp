<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>VITRALUX ERP | Inicio de sesión</title>
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>
<body class="bg-light">
    <main class="container py-5">
        <div class="row justify-content-center">
            <div class="col-md-7 col-lg-5">
                <div class="card shadow-sm">
                    <div class="card-header bg-primary text-white fw-bold">VITRALUX ERP</div>
                    <div class="card-body p-4">
                        <h1 class="h3 mb-4">Inicio de sesión</h1>

                        <div th:if="${param.error}" class="alert alert-danger" role="alert">
                            El correo o la contraseña son incorrectos.
                        </div>
                        <div th:if="${param.salida}" class="alert alert-success" role="status">
                            Cerraste sesión.
                        </div>

                        <form th:action="@{/login}" method="post">
                            <div class="mb-3">
                                <label for="username" class="form-label">Correo electrónico</label>
                                <input id="username" name="username" type="email"
                                       class="form-control" autocomplete="username" required>
                            </div>
                            <div class="mb-3">
                                <label for="password" class="form-label">Contraseña</label>
                                <input id="password" name="password" type="password"
                                       class="form-control" autocomplete="current-password" required>
                            </div>
                            <button type="submit" class="btn btn-primary w-100">Ingresar</button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </main>
</body>
</html>
