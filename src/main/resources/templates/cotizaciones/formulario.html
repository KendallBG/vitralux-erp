<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>VITRALUX ERP | Nueva cotización</title>
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>
<body class="bg-light">
    <header class="bg-primary">
        <div class="container py-3">
            <a th:href="@{/}" class="text-white text-decoration-none fw-bold">VITRALUX ERP</a>
        </div>
    </header>

    <main class="container py-4">
        <h1>Nueva cotización</h1>
        <p class="text-secondary">Seleccioná un cliente y agregá productos o servicios.</p>

        <div th:if="${error}" th:text="${error}" class="alert alert-danger" role="alert"></div>

        <div th:if="${#lists.isEmpty(clientes) or #lists.isEmpty(productos)}"
             class="alert alert-warning">
            Para cotizar, necesitás al menos un
            <a th:href="@{/clientes/nuevo}">cliente</a> y un
            <a th:href="@{/productos/nuevo}">producto o servicio</a>.
        </div>

        <form th:action="@{/cotizaciones/nueva}" method="post" class="card shadow-sm">
            <div class="card-body">
                <label for="clienteId" class="form-label">Cliente</label>
                <select id="clienteId" name="clienteId" class="form-select mb-4" required>
                    <option value="">Seleccioná un cliente</option>
                    <option th:each="cliente : ${clientes}"
                            th:value="${cliente.id}" th:text="${cliente.nombre}"></option>
                </select>

                <h2 class="h5">Conceptos</h2>
                <div id="conceptos">
                    <div class="concepto row g-2 align-items-end mb-3">
                        <label class="col-md-7">
                            <span class="form-label d-block">Producto o servicio</span>
                            <select name="productoId" class="form-select" required>
                                <option value="">Seleccioná un concepto</option>
                                <option th:each="producto : ${productos}"
                                        th:value="${producto.id}"
                                        th:text="|${producto.nombre} · ₡ ${producto.precio}|"></option>
                            </select>
                        </label>
                        <label class="col-md-3">
                            <span class="form-label d-block">Cantidad</span>
                            <input type="number" name="cantidad" class="form-control"
                                   min="1" max="9999" step="1" value="1" required>
                        </label>
                        <div class="col-md-2">
                            <button type="button" class="btn btn-outline-danger quitar" disabled>
                                Quitar
                            </button>
                        </div>
                    </div>
                </div>

                <button type="button" id="agregar" class="btn btn-outline-primary">
                    Agregar concepto
                </button>

                <div class="d-flex gap-2 mt-4">
                    <button type="submit" class="btn btn-primary"
                            th:disabled="${#lists.isEmpty(clientes) or #lists.isEmpty(productos)}">
                        Guardar cotización
                    </button>
                    <a th:href="@{/cotizaciones}" class="btn btn-outline-secondary">Cancelar</a>
                </div>
            </div>
        </form>
    </main>

    <script>
        const conceptos = document.querySelector('#conceptos');
        const agregar = document.querySelector('#agregar');
        const plantilla = conceptos.firstElementChild.cloneNode(true);

        function actualizarBotones() {
            const cantidad = conceptos.children.length;
            agregar.disabled = cantidad >= 50;
            conceptos.querySelectorAll('.quitar').forEach(function (boton) {
                boton.disabled = cantidad === 1;
            });
        }

        agregar.addEventListener('click', function () {
            conceptos.appendChild(plantilla.cloneNode(true));
            actualizarBotones();
        });

        conceptos.addEventListener('click', function (evento) {
            const boton = evento.target.closest('.quitar');
            if (boton && conceptos.children.length > 1) {
                boton.closest('.concepto').remove();
                actualizarBotones();
            }
        });
    </script>
</body>
</html>
