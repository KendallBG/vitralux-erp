<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>VITRALUX ERP | Detalle de cotización</title>
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>
<body class="bg-light">
    <header class="bg-primary">
        <div class="container py-3">
            <a th:href="@{/}" class="text-white text-decoration-none fw-bold">VITRALUX ERP</a>
        </div>
    </header>

    <main class="container py-4">
        <a th:href="@{/cotizaciones}">Volver a cotizaciones</a>
        <h1 class="mt-3" th:text="|Cotización COT-${cotizacion.id}|"></h1>
        <p>
            <strong>Cliente</strong> <span th:text="${cotizacion.cliente.nombre}"></span>
            <span class="mx-2">·</span>
            <strong>Fecha</strong> <span th:text="${cotizacion.fecha}"></span>
            <span class="mx-2">·</span>
            <span class="badge text-bg-secondary" th:text="${cotizacion.estado}"></span>
        </p>

        <div th:if="${error}" th:text="${error}" class="alert alert-danger" role="alert"></div>

        <div class="table-responsive card shadow-sm mb-3">
            <table class="table table-striped mb-0">
                <thead class="table-light">
                    <tr>
                        <th scope="col">Concepto</th>
                        <th scope="col">Cantidad</th>
                        <th scope="col">Precio unitario</th>
                        <th scope="col">Subtotal</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="detalle : ${cotizacion.detalles}">
                        <td th:text="${detalle.concepto}"></td>
                        <td th:text="${detalle.cantidad}"></td>
                        <td th:text="|₡ ${detalle.precioUnitario}|"></td>
                        <td th:text="|₡ ${detalle.subtotal}|"></td>
                    </tr>
                </tbody>
            </table>
        </div>

        <p class="fs-5 fw-bold" th:text="|Total · ₡ ${cotizacion.total}|"></p>

        <form th:if="${cotizacion.estado.name() == 'PENDIENTE'}"
              th:action="@{/cotizaciones/{id}/estado(id=${cotizacion.id})}"
              method="post" class="d-flex gap-2">
            <button type="submit" name="estado" value="APROBADA"
                    class="btn btn-success">Aprobar</button>
            <button type="submit" name="estado" value="RECHAZADA"
                    class="btn btn-outline-danger">Rechazar</button>
        </form>

        <form th:if="${cotizacion.estado.name() == 'APROBADA' and ventaId == null}"
              th:action="@{/ventas/desde-cotizacion/{id}(id=${cotizacion.id})}" method="post">
            <button type="submit" class="btn btn-primary">Generar venta</button>
        </form>

        <a th:if="${ventaId != null}" th:href="@{/ventas/{id}(id=${ventaId})}"
           class="btn btn-primary">Ver venta</a>
    </main>
</body>
</html>
