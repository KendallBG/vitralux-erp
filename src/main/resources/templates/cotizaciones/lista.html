<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>VITRALUX ERP | Cotizaciones</title>
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>
<body class="bg-light">
    <header class="bg-primary">
        <div class="container py-3">
            <a th:href="@{/}" class="text-white text-decoration-none fw-bold">VITRALUX ERP</a>
        </div>
    </header>

    <main class="container py-4">
        <div class="d-flex flex-wrap gap-2 justify-content-between align-items-center mb-3">
            <h1 class="mb-0">Cotizaciones</h1>
            <a th:href="@{/cotizaciones/nueva}" class="btn btn-primary">Nueva cotización</a>
        </div>

        <div class="table-responsive card shadow-sm">
            <table class="table table-striped align-middle mb-0">
                <thead class="table-light">
                    <tr>
                        <th scope="col">Número</th>
                        <th scope="col">Cliente</th>
                        <th scope="col">Fecha</th>
                        <th scope="col">Total</th>
                        <th scope="col">Estado</th>
                        <th scope="col">Acción</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="cotizacion : ${cotizaciones}">
                        <td th:text="|COT-${cotizacion.id}|"></td>
                        <td th:text="${cotizacion.cliente.nombre}"></td>
                        <td th:text="${cotizacion.fecha}"></td>
                        <td th:text="|₡ ${cotizacion.total}|"></td>
                        <td th:text="${cotizacion.estado}"></td>
                        <td>
                            <a th:href="@{/cotizaciones/{id}(id=${cotizacion.id})}"
                               class="btn btn-sm btn-outline-primary">Ver detalle</a>
                        </td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(cotizaciones)}">
                        <td colspan="6" class="text-center text-secondary py-4">
                            Todavía no hay cotizaciones.
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </main>
</body>
</html>
