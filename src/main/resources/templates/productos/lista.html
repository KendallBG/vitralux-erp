<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>VITRALUX ERP | Catálogo</title>
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>
<body class="bg-light">

    <header class="bg-primary text-white">
        <div class="container py-3">
            <a th:href="@{/}" class="text-white text-decoration-none fs-5 fw-bold">
                VITRALUX ERP
            </a>
        </div>
    </header>

    <main class="container py-4">
        <h1>Catálogo</h1>
        <p class="text-secondary">Productos y servicios disponibles para cotizar.</p>

        <div th:if="${mensaje}" th:text="${mensaje}"
             class="alert alert-success" role="status"></div>

        <a th:href="@{/productos/nuevo}" class="btn btn-primary mb-3">
            Nuevo registro
        </a>

        <div class="card shadow-sm">
            <div class="table-responsive">
                <table class="table table-striped align-middle mb-0"
                       aria-label="Catálogo de productos y servicios">
                    <thead class="table-light">
                        <tr>
                            <th scope="col">Nombre</th>
                            <th scope="col">Tipo</th>
                            <th scope="col">Descripción</th>
                            <th scope="col">Precio</th>
                            <th scope="col">Acciones</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="producto : ${productos}">
                            <td th:text="${producto.nombre}"></td>
                            <td th:text="${producto.tipo == 'PRODUCTO' ? 'Producto' : 'Servicio'}"></td>
                            <td th:text="${producto.descripcion}"></td>
                            <td th:text="|₡ ${producto.precio}|"></td>
                            <td>
                                <a th:href="@{/productos/editar/{id}(id=${producto.id})}"
                                   class="btn btn-sm btn-outline-primary">
                                    Editar
                                </a>
                            </td>
                        </tr>
                        <tr th:if="${#lists.isEmpty(productos)}">
                            <td colspan="5" class="text-center text-secondary py-4">
                                Todavía no hay productos ni servicios registrados.
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </main>

</body>
</html>
