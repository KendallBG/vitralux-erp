<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>VITRALUX ERP | Formulario del catálogo</title>
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>
<body class="bg-light">

    <header class="bg-primary text-white">
        <div class="container py-3">
            <a th:href="@{/}" class="text-white text-decoration-none fs-5 fw-bold">
                VITRALUX ERP
            </a>
        </div>
    </header>

    <main class="container py-4">
        <h1 class="mb-4"
            th:text="${productoId == null ? 'Nuevo registro' : 'Editar registro'}">
            Formulario del catálogo
        </h1>

        <div class="card shadow-sm">
            <div class="card-body">
                <form th:action="${productoId == null}
                          ? @{/productos/nuevo}
                          : @{/productos/editar/{id}(id=${productoId})}"
                      th:object="${producto}" method="post">
                    <div class="row g-3">
                        <div class="col-md-8">
                            <label for="nombre" class="form-label">Nombre</label>
                            <input type="text" th:field="*{nombre}"
                                   class="form-control" maxlength="120" required>
                            <div th:errors="*{nombre}" class="text-danger small"></div>
                        </div>

                        <div class="col-md-4">
                            <label for="tipo" class="form-label">Tipo</label>
                            <select th:field="*{tipo}" class="form-select" required>
                                <option value="">Seleccioná un tipo</option>
                                <option value="PRODUCTO">Producto</option>
                                <option value="SERVICIO">Servicio</option>
                            </select>
                            <div th:errors="*{tipo}" class="text-danger small"></div>
                        </div>

                        <div class="col-12">
                            <label for="descripcion" class="form-label">Descripción</label>
                            <textarea th:field="*{descripcion}" class="form-control"
                                      rows="3" maxlength="255" required></textarea>
                            <div th:errors="*{descripcion}" class="text-danger small"></div>
                        </div>

                        <div class="col-md-4">
                            <label for="precio" class="form-label">Precio (₡)</label>
                            <input type="number" th:field="*{precio}" class="form-control"
                                   min="0" max="9999999999.99" step="0.01" required>
                            <div th:errors="*{precio}" class="text-danger small"></div>
                        </div>
                    </div>

                    <div class="d-flex gap-2 mt-4">
                        <button type="submit" class="btn btn-primary">Guardar</button>
                        <a th:href="@{/productos}" class="btn btn-outline-secondary">
                            Cancelar
                        </a>
                    </div>
                </form>
            </div>
        </div>
    </main>

</body>
</html>
