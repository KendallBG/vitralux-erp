<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${cliente.id == null
            ? 'VITRALUX ERP | Nuevo cliente'
            : 'VITRALUX ERP | Editar cliente'}">VITRALUX ERP | Clientes</title>
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>
<body class="bg-light">

    <header class="bg-primary text-white">
        <div class="container py-3">
            <a class="text-white text-decoration-none fs-5 fw-bold"
               th:href="@{/}">VITRALUX ERP</a>
        </div>
    </header>

    <main class="container py-4">
        <h1 class="mb-4"
            th:text="${cliente.id == null ? 'Nuevo cliente' : 'Editar cliente'}">
            Nuevo cliente
        </h1>

        <div class="card shadow-sm">
            <div class="card-body">
                <form th:action="${cliente.id == null}
                          ? @{/clientes/nuevo}
                          : @{/clientes/editar/{id}(id=${cliente.id})}"
                      th:object="${cliente}"
                      method="post">
                    <div class="row g-3">
                        <div class="col-md-6">
                            <label for="nombre" class="form-label">Nombre</label>
                            <input type="text" class="form-control"
                                   th:field="*{nombre}" maxlength="120" required>
                        </div>

                        <div class="col-md-6">
                            <label for="telefono" class="form-label">Teléfono</label>
                            <input type="tel" class="form-control"
                                   th:field="*{telefono}" maxlength="25" required>
                        </div>

                        <div class="col-md-6">
                            <label for="correo" class="form-label">Correo electrónico</label>
                            <input type="email" class="form-control"
                                   th:field="*{correo}" maxlength="150" required>
                        </div>

                        <div class="col-md-6">
                            <label for="direccion" class="form-label">Dirección</label>
                            <input type="text" class="form-control"
                                   th:field="*{direccion}" maxlength="255" required>
                        </div>
                    </div>

                    <div class="d-flex gap-2 mt-4">
                        <button type="submit" class="btn btn-primary">Guardar cliente</button>
                        <a th:href="@{/clientes}" class="btn btn-outline-secondary">Cancelar</a>
                    </div>
                </form>
            </div>
        </div>
    </main>

</body>
</html>
