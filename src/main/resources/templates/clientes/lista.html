<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>VITRALUX ERP | Clientes</title>
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>
<body class="bg-light">

    <header class="bg-primary text-white">
        <div class="container py-3">
            <a class="text-white text-decoration-none fs-5 fw-bold"
               th:href="@{/}">VITRALUX ERP</a>
        </div>
    </header>

    <main class="container py-4">
        <h1 class="mb-2">Clientes</h1>
        <p class="text-secondary mb-4">Listado de clientes registrados.</p>

        <div th:if="${mensaje}" th:text="${mensaje}"
             class="alert alert-success" role="status"></div>

        <div th:if="${error}" th:text="${error}"
             class="alert alert-danger" role="alert"></div>

        <a th:href="@{/clientes/nuevo}" class="btn btn-primary mb-3">
            Nuevo cliente
        </a>

        <div class="card shadow-sm">
            <div class="table-responsive">
                <table class="table table-striped align-middle mb-0"
                       aria-label="Listado de clientes">
                    <thead class="table-light">
                        <tr>
                            <th scope="col">Nombre</th>
                            <th scope="col">Teléfono</th>
                            <th scope="col">Correo</th>
                            <th scope="col">Dirección</th>
                            <th scope="col">Acciones</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="cliente : ${clientes}">
                            <td th:text="${cliente.nombre}"></td>
                            <td th:text="${cliente.telefono}"></td>
                            <td th:text="${cliente.correo}"></td>
                            <td th:text="${cliente.direccion}"></td>
                            <td>
                                <div class="d-flex flex-wrap gap-2">
                                    <a th:href="@{/clientes/editar/{id}(id=${cliente.id})}"
                                       class="btn btn-sm btn-outline-primary">
                                        Editar
                                    </a>
                                    <form th:action="@{/clientes/eliminar/{id}(id=${cliente.id})}"
                                          method="post"
                                          onsubmit="return window.confirm('¿Querés eliminar este cliente?');">
                                        <button type="submit"
                                                class="btn btn-sm btn-outline-danger">
                                            Eliminar
                                        </button>
                                    </form>
                                </div>
                            </td>
                        </tr>
                        <tr th:if="${#lists.isEmpty(clientes)}">
                            <td colspan="5" class="text-center text-secondary py-4">
                                Todavía no hay clientes registrados.
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </main>

</body>
</html>
